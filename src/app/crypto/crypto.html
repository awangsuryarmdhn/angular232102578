<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="content-wrapper">
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1>Crypto Price Tracker ( Sumber CoinPaprika)</h1>
        </div>
      </div>
    </div>
  </section>

  <section class="content">
    <div class="container-fluid">
      <div class="card card-purple card-outline">
        <div class="card-header">
          <h3 class="card-title">Harga Realtime</h3>
          <div class="card-tools">
            <button class="btn btn-tool" (click)="getTop10CoinPaprika()">
              <i class="fas fa-sync"></i> Refresh
            </button>
          </div>
        </div>
        
        <div class="card-body p-0">
          <div *ngIf="isLoading" class="p-3 text-center text-muted">
            <i class="fas fa-spinner fa-spin"></i> Sedang mengambil data...
          </div>

          <table id="table1" class="table table-striped table-hover" [style.display]="isLoading ? 'none' : 'table'">
            <thead>
              <tr>
                <th style="width: 10px">Rank</th>
                <th>Nama Aset</th>
                <th class="text-right">Harga (IDR)</th>
                <th class="text-center">24h %</th>
                <th class="text-center">Trade</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let coin of dataCrypto">
                
                <td>{{ coin.rank }}</td>
                
                <td>
                  <div style="display: flex; align-items: center;">
                    <img [src]="'https://static.coinpaprika.com/coin/' + coin.id + '/logo.png'" 
                         style="width: 25px; height: 25px; margin-right: 10px; border-radius: 50%;"
                         onerror="this.style.display='none'"> 
                    <div>
                      <strong>{{ coin.name }}</strong><br>
                      <small class="text-muted">{{ coin.symbol }}</small>
                    </div>
                  </div>
                </td>
                
                <td class="text-right font-weight-bold">
                  {{ formatRupiah(coin.quotes.IDR.price) }}
                </td>

                <td class="text-center">
                  <span [class]="getColorClass(coin.quotes.IDR.percent_change_24h)">
                    {{ coin.quotes.IDR.percent_change_24h }}%
                  </span>
                </td>

                <td class="text-center">
                  <a [href]="'https://www.tokocrypto.com/id/trade/' + coin.symbol + '_IDR'" 
                    target="_blank" 
                    class="text-decoration-none font-weight-bold">
                    BUY/SELL
                  </a>
                </td>
                
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</div>
<app-footer></app-footer>
